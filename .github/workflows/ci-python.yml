name: Tests Python TEG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygame
        run: python -m pip install "pygame>=2.5,<3"
      - name: Check Python syntax
        run: python -m compileall -q teg_revancha
      - name: Run game regression suite
        run: python -m unittest discover -s teg_revancha -p "test_*.py" -v
